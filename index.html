<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto Treno</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Calcola il prezzo del biglietto</h1>

    <form id="form-biglietto">
        <label for="nome">Nome passeggero</label>
        <input type="text" id="nome">

        <label for="km">Chilometri da percorrere</label>
        <input type="number" id="km" min="1">

        <label for="eta">Fascia d'età</label>
        <select id="eta">
            <option value="maggiorenne">Maggiorenne</option>
            <option value="minorenne">Minorenne</option>
            <option value="over65">Over 65</option>
        </select>

        <button type="submit">Calcola</button>
    </form>

    <div id="risultato"></div>

    <script src="js/script.js"></script>
</body>

</html>
